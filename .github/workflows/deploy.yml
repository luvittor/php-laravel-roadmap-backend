name: Deploy Roadmap Backend to Dreamhost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REMOTE_PHP: /usr/local/php83/bin/php

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, exif, pcntl, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: Create temp directory on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp
            mkdir /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp

      - name: Deploy Laravel via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          # Uploading the entire repository with vendor
          source: "./"
          target: "/home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp"

      - name: Manage Files on the server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            set -e

            # Cleanup unnecessary files and directories from temp directory
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/.github
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/.git
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/.gitignore
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/README*
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/LICENSE*
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/*.md
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/.env*
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/storage/logs/*.log
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/tests
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/docs
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/Dockerfile*
            rm -rf /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/docker-compose.yml
            
            # Load the private production environment from its new location.
            cp /home/dh_jirb5e/vettoretti.dev_envs/roadmap_api.env /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/.env

            # Fail before activation if the host's PHP CLI is below the app requirement.
            REMOTE_PHP='${{ env.REMOTE_PHP }}'
            if ! "$REMOTE_PHP" -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);'; then
              echo 'DreamHost PHP CLI must be 8.3 or newer.' >&2
              exit 1
            fi
            "$REMOTE_PHP" --version

            # Install the versioned rewrite rule at the app root before activation.
            mv /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/backend-root.htaccess /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp/.htaccess

            # Apply database changes while the current API release is still active.
            cd /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp
            "$REMOTE_PHP" artisan migrate --force

            # Create the target directory if it doesn't exist
            mkdir -p /home/dh_jirb5e/vettoretti.dev/roadmap

            # Rename current api directory to api_old, if it exists
            mv /home/dh_jirb5e/vettoretti.dev/roadmap/api /home/dh_jirb5e/vettoretti.dev/roadmap/api_old 2>/dev/null || true

            # Move the temp directory to the final location
            mv /home/dh_jirb5e/vettoretti.dev_roadmap_api_tmp /home/dh_jirb5e/vettoretti.dev/roadmap/api

            # Set file permissions (maybe necessary depending on your server setup)
            # chown -R dh_jirb5e:dh_jirb5e /home/dh_jirb5e/vettoretti.dev/roadmap/api
            # find /home/dh_jirb5e/vettoretti.dev/roadmap/api -type f -exec chmod 644 {} \;
            # find /home/dh_jirb5e/vettoretti.dev/roadmap/api -type d -exec chmod 755 {} \;

            # Generate Laravel caches (optional, but recommended)
            cd /home/dh_jirb5e/vettoretti.dev/roadmap/api
            "$REMOTE_PHP" artisan config:cache
            "$REMOTE_PHP" artisan route:cache
            "$REMOTE_PHP" artisan view:cache

            # Clear old api directory if it exists
            rm -rf /home/dh_jirb5e/vettoretti.dev/roadmap/api_old
